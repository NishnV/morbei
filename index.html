<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      SEO BLOCK — everything between the markers below is REPLACED per route by
      scripts/prerender-og.mjs at build time, so crawlers that don't run JS
      (WhatsApp, Instagram, Slack, X) get real per-page metadata.

      <Seo> (react-helmet-async) emits the same tags at runtime for browsers.
      Helmet appends rather than replaces markup it did not render, so these
      static values MUST match what <Seo> produces for the same route —
      otherwise a crawler reads the first (stale) copy and the per-page tags
      are silently discarded. That is exactly what happened before prerendering
      existed. Keep the two in sync.
    -->
    <!--seo:start-->
    <title>MORBEI</title>
    <meta name="description" content="MORBEI — minimalist fashion crafted in India. Dresses, tops and bottoms designed with restraint. Free shipping across India." />
    <link rel="canonical" href="https://morbei.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MORBEI" />
    <meta property="og:title" content="MORBEI" />
    <meta property="og:description" content="Minimalist fashion crafted in India. Designed with restraint." />
    <meta property="og:image" content="https://morbei.vercel.app/og-image.jpg" />
    <meta property="og:url" content="https://morbei.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MORBEI" />
    <meta name="twitter:description" content="Minimalist fashion crafted in India. Designed with restraint." />
    <meta name="twitter:image" content="https://morbei.vercel.app/og-image.jpg" />
    <!--seo:end-->

    <!--
      Every page's first data fetch goes to the Shopify Storefront API, and
      every product image comes from Shopify's CDN — two origins the browser
      would otherwise only discover once React has booted and issued the
      request. Opening the DNS + TLS connections up front takes that handshake
      (100-300ms on mobile) off the critical path.
    -->
    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />
    <link rel="preconnect" href="https://%VITE_SHOPIFY_STORE_DOMAIN%" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.shopify.com" />

    <!-- Fonts are self-hosted (src/styles/fonts.css) — no third-party round
         trip on the critical path. Preload only the two latin files that render
         above the fold; latin-ext loads on demand via unicode-range. -->
    <link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      Meta Pixel. The base snippet fires PageView once, on document load.
      This is a single-page app, so a shopper moving from the home page to a
      product to the cart never loads a document again — App.jsx fires the
      PageView for every route change after the first. Without that, Meta
      would record one page view per session.

      connect.facebook.net and www.facebook.com are allowed in the CSP in
      vercel.json (script-src, img-src, connect-src). Nothing loads without
      that, so if the pixel ever goes quiet, check there first.
    -->
    <!-- The Meta Pixel used to initialise and fire PageView from here, which
         meant it had already transmitted before the visitor saw the page, and
         so before anything could ask them. It now loads from
         src/lib/metaPixel.js, after consent. The CSP entries below still
         apply; nothing about the allowed origins changed. -->
  </head>
  <body>
    <!-- The no-JavaScript pixel fallback was removed with the inline tag
         above. It cannot be deferred behind a consent decision, because a
         visitor with JavaScript off can neither be shown the notice nor make
         one — so it would have been the single remaining path that tracked
         someone who was never asked. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
